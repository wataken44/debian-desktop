- name: clean up
  ansible.builtin.apt:
    autoclean: yes
    autoremove: yes

- name: backup old sources
  ansible.builtin.copy:
    src: /etc/apt/sources.list
    dest: /etc/apt/sources.list.bak
    remote_src: yes
    owner: root
    group: root
    mode: '0644'

- name: remove old sources
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/apt/sources.list
    - /etc/apt/sources.list~

- name: add testing sources
  ansible.builtin.template:
    src: debian.sources
    dest: /etc/apt/sources.list.d/debian.sources
    owner: root
    group: root
    mode: "0644"
  
- name: update packages
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: upgrade packages
  ansible.builtin.apt:
    upgrade: dist
    
- name: clean up
  ansible.builtin.apt:
    autoclean: yes
    autoremove: yes

