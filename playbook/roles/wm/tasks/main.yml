- name: install xfce and related packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  with_items:
    - lightdm
    - lightdm-gtk-greeter
    - xfce4
    - xfce4-goodies
    - network-manager-applet
    - gnome-keyring
    - libsecret-1-0
    - libpam-gnome-keyring

- name: configure lightdm
  ansible.builtin.ini_file:
    path: /etc/lightdm/lightdm.conf
    section: "Seat:*"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
    create: true
  loop:
    - { option: "greeter-hide-users", value: "false" }
    - { option: "greeter-show-manual-login", value: "false" }
    - { option: "allow-guest", value: "false" }

- name: enable lightdm
  service:
    name: lightdm
    enabled: true

- name: clone xfce theme
  ansible.builtin.git:
    repo: "https://github.com/MX-Linux/mx-comfort-themes.git"
    dest: /tmp/mx-comfort-themes/

- name: copy xfce theme
  ansible.builtin.copy:
    src: "/tmp/mx-comfort-themes/{{ item }}"
    dest: /usr/share/themes/
    remote_src: true
    mode: "0755"
    owner: "root"
    group: "root"
  with_items:
    - mx-comfort
    - mx-comfort-dark
